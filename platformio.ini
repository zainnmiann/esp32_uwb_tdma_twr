; ESP32 UWB Pro with Display — TDMA DS-TWR port
; Protocol logic ported from dwm1001_tdma_twr (that tree is never modified).
; Radio driver: Makerfabs mf_DW1000, vendored unmodified under lib/DW1000.

[env:esp32_uwb_pro_display]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 921600
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
build_flags =
  -I include
  -DCORE_DEBUG_LEVEL=0
  -DFW_VERSION_STR=\"1.0.0-esp32\"
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.9
  adafruit/Adafruit GFX Library@^1.11.9
